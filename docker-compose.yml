# Optional containerized deployment for ATLAS.
#
# Usage:
#   docker compose up --build
#   Dashboard: http://localhost:8501
#   API:       http://localhost:8000/health
#
# Both services share the same image and the same ./data volume, so
# datasets loaded via the dashboard are visible to the API and vice versa
# (they use the same SQLite file by default -- see .env.example).

services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
